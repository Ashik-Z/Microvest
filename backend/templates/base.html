<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Microvest{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    {% if user is defined and user %}
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <a href="/dashboard" class="text-green-400 font-bold text-xl tracking-wide">📈 Microvest</a>
        <div class="flex gap-6 items-center text-sm">
            <a href="/dashboard" class="hover:text-green-400 transition">Dashboard</a>
            <a href="/watchlist" class="hover:text-green-400 transition">Watchlist</a>
            <a href="/portfolio" class="hover:text-green-400 transition">Portfolio</a>
            <span class="text-gray-500">|</span>
            <span class="text-gray-400">{{ user.username }}</span>
            <a href="/logout" class="text-red-400 hover:text-red-300 transition">Logout</a>
        </div>
    </nav>
    {% endif %}

    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
